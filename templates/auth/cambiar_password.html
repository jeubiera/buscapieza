{% extends "base.html" %}
{% block title %}Cambiar contraseña — BuscatodoRD{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="BuscatodoRD" width="226" height="72">
      <div class="auth-logo-sub">Cambiar contraseña</div>
    </div>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Contraseña actual</label>
        <input type="password" name="actual" class="form-control" required autocomplete="current-password" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Nueva contraseña</label>
        <input type="password" name="password" class="form-control" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
      </div>
      <div class="form-group">
        <label class="form-label">Repite la nueva contraseña</label>
        <input type="password" name="password2" class="form-control" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:8px;">
        <i class="fas fa-key"></i> Guardar
      </button>
    </form>
  </div>
</div>
{% endblock %}
