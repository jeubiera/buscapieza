{% extends "base.html" %}
{% block title %}Iniciar Sesión — BuscatodoRD{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="BuscatodoRD" width="226" height="72">
      <div class="auth-logo-sub">Inicia sesión en tu cuenta</div>
    </div>
    <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" name="email" class="form-control" placeholder="tucorreo@email.com" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:8px;">
        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
      </button>
    </form>
    <hr class="divider">
    <p style="text-align:center;font-size:14px;color:var(--text-light);">
      ¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}" class="auth-link">Regístrate gratis</a>
    </p>
  </div>
</div>
{% endblock %}
