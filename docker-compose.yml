version: '3.8'

services:
  # ============================================
  # BASE DE DATOS POSTGRESQL
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: buscapieza_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: buscapieza
      POSTGRES_USER: buscapieza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    # Solo accesible desde la red interna de Docker (quita el comentario para exponerlo)
    # ports:
    #   - "5432:5432"
    networks:
      - buscapieza_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buscapieza -d buscapieza"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # APLICACIÓN FLASK
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buscapieza_web
    restart: unless-stopped
    environment:
      # Flask
      FLASK_ENV: production
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5050
      FLASK_DEBUG: "False"

      # Seguridad
      SECRET_KEY: ${SECRET_KEY}

      # Base de datos
      DATABASE_URL: postgresql+psycopg2://buscapieza:${POSTGRES_PASSWORD}@db:5432/buscapieza

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Green API (WhatsApp)
      GREEN_API_INSTANCE: ${GREEN_API_INSTANCE}
      GREEN_API_TOKEN: ${GREEN_API_TOKEN}

      # Firebase (el JSON se monta en /app/secrets, ver volumes)
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      FIREBASE_WEB_CONFIG: ${FIREBASE_WEB_CONFIG:-}
      FIREBASE_VAPID_PUBLIC: ${FIREBASE_VAPID_PUBLIC:-}

      # Admin inicial y URL pública
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@buscapieza.do}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_URL: ${APP_URL:-http://localhost:5050}

      # Broker
      BROKER_WHATSAPP: ${BROKER_WHATSAPP:-18091234567}
      BROKER_NOMBRE: ${BROKER_NOMBRE:-BuscaPieza RD}
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./logs:/app/logs
      - ./secrets:/app/secrets:ro
    ports:
      - "5050:5050"
    networks:
      - buscapieza_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # NGINX REVERSE PROXY (OPCIONAL)
  # ============================================
  # Descomenta si quieres usar Nginx como proxy
  # nginx:
  #   image: nginx:alpine
  #   container_name: buscapieza_nginx
  #   restart: unless-stopped
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./static:/app/static:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   networks:
  #     - buscapieza_network
  #   depends_on:
  #     - web

# ============================================
# VOLÚMENES
# ============================================
volumes:
  postgres_data:
    driver: local

# ============================================
# REDES
# ============================================
networks:
  buscapieza_network:
    driver: bridge
