[pytest]
# Configuración de pytest para BuscaPieza RD

# Patrones de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directorio de tests
testpaths = tests

# Opciones por defecto
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Marcadores personalizados
markers =
    slow: tests que toman mucho tiempo
    integration: tests de integración
    unit: tests unitarios
    auth: tests de autenticación
    database: tests que requieren base de datos

# Las variables de entorno de test (SECRET_KEY, FLASK_ENV) se fijan en tests/conftest.py
